name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck every module standalone
        run: shellcheck lib/*.sh build.sh

      - name: Build, then ShellCheck the generated script (the artifact that actually runs)
        run: |
          ./build.sh /tmp/statusline-command.sh
          shellcheck /tmp/statusline-command.sh
