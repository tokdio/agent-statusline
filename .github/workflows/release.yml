name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag points at a commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point to a commit reachable from main; refusing to release off a side branch."
            exit 1
          fi

      - name: ShellCheck source
        run: shellcheck lib/*.sh build.sh

      - name: Build release artifact
        run: ./build.sh dist/statusline-command.sh

      - name: ShellCheck built artifact
        run: shellcheck dist/statusline-command.sh

      - name: Extract changelog section for this version
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(sed -n "/^## \[$version\]/,/^## \[/p" CHANGELOG.md | sed '$d')"
          if [[ -z "$notes" ]]; then
            echo "::error::No CHANGELOG.md section found for version $version (expected a '## [$version]' heading)."
            exit 1
          fi
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$notes"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "${{ steps.changelog.outputs.notes }}" \
            --latest \
            dist/statusline-command.sh
